<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>LSFFL Standings</title>

  <style>
    :root {
      --navy-950: #020b14;
      --navy-900: #041426;
      --navy-850: #061a30;
      --navy-800: #08223d;
      --navy-700: #0d3155;

      --gold-700: #9c6d09;
      --gold-600: #bd890d;
      --gold-500: #e3aa18;
      --gold-400: #f1c64b;

      --white: #ffffff;
      --text: #eef4fb;
      --muted: #aebdcd;
      --green: #29dc55;
      --red: #ff6464;

      --line: rgba(227, 170, 24, 0.76);
      --soft-line: rgba(255, 255, 255, 0.09);
      --row-even: rgba(9, 37, 64, 0.72);
      --row-odd: rgba(5, 26, 47, 0.76);

      --panel-shadow:
        0 15px 36px rgba(0, 0, 0, 0.38),
        inset 0 0 30px rgba(255, 255, 255, 0.015);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--text);
      background: transparent;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }
img {
      display: block;
      max-width: 100%;
    }

    .lsffl-standings-app {
      width: 100%;
      margin: 0 auto;
      padding: 10px 12px 18px;
    }

    .lsffl-layout {
      display: grid;
      grid-template-columns: minmax(0, 2.55fr) minmax(330px, 0.95fr);
      gap: 14px;
      align-items: stretch;
    }

    .lsffl-panel {
      min-width: 0;
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          rgba(7, 29, 51, 0.98),
          rgba(2, 14, 27, 0.98)
        );
      border: 2px solid var(--gold-500);
      border-radius: 11px;
      box-shadow: var(--panel-shadow);
    }

    .lsffl-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 58px;
      padding: 10px 16px;
      background:
        linear-gradient(
          180deg,
          rgba(10, 42, 72, 0.96),
          rgba(4, 24, 44, 0.96)
        );
      border-bottom: 1px solid var(--line);
    }

    .lsffl-panel-title {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      margin: 0;
      color: var(--white);
      font-size: clamp(20px, 2vw, 30px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.035em;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.58);
    }

    .lsffl-panel-title::before,
    .lsffl-panel-title::after {
      color: var(--gold-500);
      font-style: normal;
      text-shadow: 0 0 12px rgba(227, 170, 24, 0.38);
    }

    .lsffl-standings-title::before {
      content: "★";
    }

    .lsffl-standings-title::after {
      content: "★";
    }

    .lsffl-power-title::before {
      content: "▥";
      transform: rotate(180deg);
    }

    .lsffl-power-title::after {
      content: "★";
    }
.lsffl-table-wrap {
      width: 100%;
      overflow: hidden;
    }

    .lsffl-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .lsffl-table th {
      height: 34px;
      padding: 7px 6px;
      color: #091523;
      background:
        linear-gradient(
          180deg,
          var(--gold-400),
          var(--gold-600)
        );
      border-right: 1px solid rgba(90, 56, 0, 0.35);
      border-bottom: 1px solid var(--gold-700);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.025em;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .lsffl-table th:last-child {
      border-right: 0;
    }

    .lsffl-table td {
      height: 44px;
      padding: 5px 7px;
      border-bottom: 1px solid var(--soft-line);
      color: var(--text);
      font-size: 13px;
      text-align: center;
      white-space: nowrap;
    }

    .lsffl-table tbody tr:nth-child(odd) td {
      background: var(--row-odd);
    }

    .lsffl-table tbody tr:nth-child(even) td {
      background: var(--row-even);
    }

    .lsffl-table tbody tr {
      transition:
        transform 0.16s ease,
        filter 0.16s ease;
    }

    .lsffl-table tbody tr:hover {
      filter: brightness(1.16);
    }

    .lsffl-table tbody tr:hover td:first-child {
      box-shadow: inset 4px 0 0 var(--gold-500);
    }

    .lsffl-rank-cell {
      color: var(--gold-400) !important;
      font-size: 18px !important;
      font-weight: 900;
    }

    .lsffl-franchise-cell {
      padding-left: 6px !important;
      padding-right: 8px !important;
      text-align: left !important;
    }

    .lsffl-team-link {
      color: inherit;
      text-decoration: none;
    }

    .lsffl-standings-franchise {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 2px 4px;
    }

    .lsffl-standings-logo {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.48));
    }

    .lsffl-standings-name {
      overflow: hidden;
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lsffl-standings-franchise:hover .lsffl-standings-name {
      color: var(--gold-400);
    }

    .lsffl-team-link:focus-visible {
      outline: 2px solid var(--gold-400);
      outline-offset: 2px;
    }

    .lsffl-positive {
      color: var(--green) !important;
      font-weight: 800;
    }

    .lsffl-negative {
      color: var(--red) !important;
      font-weight: 800;
    }

    .lsffl-neutral {
      color: var(--muted) !important;
    }

    .lsffl-division-list {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .lsffl-division-block {
      overflow: hidden;
      border: 1px solid rgba(227, 170, 24, 0.78);
      border-radius: 8px;
      background: rgba(2, 14, 27, 0.96);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.30),
        inset 0 0 18px rgba(255, 255, 255, 0.018);
    }

    .lsffl-division-heading {
      margin: 0;
      padding: 9px 14px;
      color: var(--white);
      background:
        linear-gradient(
          180deg,
          rgba(13, 49, 85, 0.98),
          rgba(4, 24, 44, 0.98)
        );
      border-bottom: 1px solid var(--gold-500);
      font-size: 17px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.045em;
      text-align: left;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.62);
    }

    .lsffl-division-table-wrap {
      width: 100%;
      overflow: hidden;
    }

    .lsffl-footer-key {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 20px;
      min-height: 42px;
      padding: 8px 14px;
      color: #d4dfeb;
      background: rgba(1, 12, 23, 0.96);
      border-top: 1px solid var(--line);
      font-size: 11px;
    }

    .lsffl-footer-key strong {
      color: var(--gold-500);
    }

    .lsffl-power-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .lsffl-power-panel > .lsffl-table-wrap {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .lsffl-power-table {
      height: 100%;
    }

    .lsffl-power-table tbody {
      height: 100%;
    }

    .lsffl-power-table tbody tr {
      height: 6.25%;
    }

    .lsffl-power-table th:nth-child(1),
    .lsffl-power-table td:nth-child(1) {
      width: 50px;
      min-width: 50px;
      padding-left: 4px;
      padding-right: 4px;
      white-space: nowrap;
    }

    .lsffl-power-table th:nth-child(2),
    .lsffl-power-table td:nth-child(2) {
      width: auto;
    }

    .lsffl-power-table th:nth-child(3),
    .lsffl-power-table td:nth-child(3) {
      width: 38px;
      min-width: 38px;
      padding-left: 2px;
      padding-right: 2px;
    }

    .lsffl-power-table th:nth-child(4),
    .lsffl-power-table td:nth-child(4) {
      width: 29px;
      min-width: 29px;
      padding-left: 2px;
      padding-right: 2px;
    }

    .lsffl-power-table th:nth-child(5),
    .lsffl-power-table td:nth-child(5) {
      width: 29px;
      min-width: 29px;
      padding-left: 2px;
      padding-right: 2px;
    }

    .lsffl-power-franchise {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      text-align: left;
    }

    .lsffl-power-helmet {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      object-fit: contain;
      filter:
        drop-shadow(0 4px 4px rgba(0, 0, 0, 0.72));
    }

    .lsffl-power-name {
      overflow: hidden;
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: 0.2px;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .lsffl-power-table td {
      height: auto;
      min-height: 76px;
      padding-top: 4px;
      padding-bottom: 4px;
    }

    .lsffl-power-rank {
      color: var(--gold-400) !important;
      font-size: 17px !important;
      font-weight: 900;
    }

    .lsffl-message {
      margin: 0;
      padding: 28px 18px;
      color: var(--muted);
      background: rgba(4, 22, 40, 0.94);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .lsffl-message-error {
      color: #ffd3d3;
    }

    .lsffl-loading {
      animation: lsfflPulse 1.1s ease-in-out infinite alternate;
    }

    @keyframes lsfflPulse {
      from {
        opacity: 0.45;
      }

      to {
        opacity: 1;
      }
    }

    @media (max-width: 760px) {
      .lsffl-layout {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .lsffl-power-panel {
        width: 100%;
        height: auto;
      }

      .lsffl-power-panel > .lsffl-table-wrap {
        display: block;
      }

      .lsffl-power-table,
      .lsffl-power-table tbody {
        height: auto;
      }

      .lsffl-power-table tbody tr {
        height: auto;
      }
    }

    @media (max-width: 720px) {
      .lsffl-standings-app {
        padding: 6px;
      }

      .lsffl-panel-header {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .lsffl-panel-title {
        justify-content: center;
        text-align: center;
      }
.lsffl-standings-table th,
      .lsffl-standings-table td {
        padding-left: 3px;
        padding-right: 3px;
        font-size: 10px;
      }

      .lsffl-standings-logo {
        width: 30px;
        height: 30px;
        flex-basis: 30px;
      }

      .lsffl-standings-name {
        font-size: 11px;
      }
.lsffl-power-helmet {
        width: 62px;
        height: 62px;
        flex-basis: 62px;
      }

      .lsffl-standings-table,
      .lsffl-power-table {
        min-width: 0;
      }
    }
  
    .lsffl-standings-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .lsffl-standings-record {
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }

    .lsffl-clickable-row {
      cursor: pointer;
    }

    .lsffl-clickable-row:focus-visible {
      outline: 2px solid var(--gold-400);
      outline-offset: -2px;
    }

    .lsffl-power-logo {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      object-fit: contain;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.58));
    }

    @media (max-width: 720px) {
      .lsffl-standings-record {
        font-size: 9px;
      }

      .lsffl-power-logo {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
      }
    }

  </style>
</head>

<body>

  <main
    class="lsffl-standings-app"
    id="lsffl-standings-app"
  >
    <div class="lsffl-layout">

      <section class="lsffl-panel">
        <header class="lsffl-panel-header">
          <h1 class="lsffl-panel-title lsffl-standings-title">
            Division Standings
          </h1>
        </header>

        <div
          id="division-standings"
          class="lsffl-division-list"
          aria-live="polite"
        >
          <p class="lsffl-message lsffl-loading">
            Loading all four LSFFL divisions…
          </p>
        </div>

        <footer class="lsffl-footer-key">
          <span><strong>PCT:</strong> Win Percentage</span>
          <span><strong>PF:</strong> Points For</span>
          <span><strong>PA:</strong> Points Against</span>
          <span><strong>DIFF:</strong> Point Differential</span>
          <span><strong>STRK:</strong> Current Streak</span>
        </footer>
      </section>

      <section class="lsffl-panel lsffl-power-panel">
        <header class="lsffl-panel-header">
          <h2 class="lsffl-panel-title lsffl-power-title">
            Power Rankings
          </h2>
        </header>

        <div class="lsffl-table-wrap">
          <table
            class="lsffl-table lsffl-power-table"
            aria-label="LSFFL power rankings"
          >
            <thead>
              <tr>
                <th>Rank</th>
                <th>Franchise</th>
                <th>Eff</th>
                <th title="Could Have Won">CW</th>
                <th title="Could Have Lost">CL</th>
              </tr>
            </thead>

            <tbody id="power-body">
              <tr>
                <td colspan="5">
                  <p class="lsffl-message lsffl-loading">
                    Loading power rankings…
                  </p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <script>
    (function () {
      "use strict";

      const DATA_FILES = {
        league: "data/league.json",
        standings: "data/standings.json"
      };

      const BANNER_BY_ID = {
        "0001": "Spartans.png",
        "0002": "Saints.png",
        "0003": "gmen.png",
        "0004": "Hambone Hogs.png",
        "0005": "Purple Hooters.png",
        "0006": "Mustangs.png",
        "0007": "Hawky Bears.png",
        "0008": "Daboys.png",
        "0009": "Dawgs.png",
        "0010": "Camel Toes.png",
        "0011": "Cougars.png",
        "0012": "MothaBucca.png",
        "0013": "Mad Hatters.png",
        "0014": "TBM.png",
        "0015": "GOMD.png",
        "0016": "Avalanche.png"
      };


      const LOGO_BY_ID = {
        "0001": "Spartans Secondary Logo.png",
        "0002": "Saints Secondary Logo.png",
        "0003": "G-Men Secondary Logo.png",
        "0004": "Hambone Hogs Secondary Logo.png",
        "0005": "Purple Hooters Secondary Logo.png",
        "0006": "Mustangs Secondary Logo.png",
        "0007": "Hawky Bears Secondary Logo.png",
        "0008": "DaBoys Secondary Logo.png",
        "0009": "Dawgs Secondary Logo.png",
        "0010": "Camel Toes Secondary Logo.png",
        "0011": "Cougars Helmet.png",
        "0012": "Mothabucca Secondary Logo.png",
        "0013": "Mad Hatters Secondary Logo.png",
        "0014": "Tiny But Mighty Secondary Logo.png",
        "0015": "Get Off My Ditka Secondary Logo.png",
        "0016": "Avalanche Secondary Logo.png"
      };

      const HELMET_BY_ID = {
        "0001": "Spartans Helmet.png",
        "0002": "Saints Helmet.png",
        "0003": "G-Men Helmet.png",
        "0004": "Hambone Hogs Helmet.png",
        "0005": "Purple Hooters Helmet.png",
        "0006": "Mustangs Helmet.png",
        "0007": "Hawky Bears Helmet.png",
        "0008": "DaBoys Helmet.png",
        "0009": "Dawgs Helmet.png",
        "0010": "Camel Toes Helmet.png",
        "0011": "Cougars Helmet.png",
        "0012": "MothaBucca Helmet.png",
        "0013": "Mad Hatters Helmet.png",
        "0014": "TBM Helmet.png",
        "0015": "GOMD Helmet.png",
        "0016": "Avalanche Helmet.png"
      };

      const TEAM_NAME_OVERRIDES = {
        "0003": "G-Men",
        "0004": "Hambone Hogs",
        "0006": "Mustangs",
        "0014": "Tiny But Mighty",
        "0015": "Get Off My Ditka"
      };

      const TEAM_PAGE_BY_ID = {
        "0001": "teams/spartans.html",
        "0002": "teams/saints.html",
        "0003": "teams/g-men.html",
        "0004": "teams/hambone-hogs.html",
        "0005": "teams/purple-hooters.html",
        "0006": "teams/mustangs.html",
        "0007": "teams/hawky-bears.html",
        "0008": "teams/da-boys.html",
        "0009": "teams/dawgs.html",
        "0010": "teams/camel-toes.html",
        "0011": "teams/cougars.html",
        "0012": "teams/mothabucca.html",
        "0013": "teams/mad-hatters.html",
        "0014": "teams/tiny-but-mighty.html",
        "0015": "teams/get-off-my-ditka.html",
        "0016": "teams/avalanche.html"
      };

      const divisionStandings =
        document.getElementById("division-standings");

      const powerBody =
        document.getElementById("power-body");

      let allTeams = [];
      let divisionsById = {};

      function asArray(value) {
        if (Array.isArray(value)) {
          return value;
        }

        if (value === null || value === undefined) {
          return [];
        }

        return [value];
      }

      function text(value, fallback = "") {
        if (value === null || value === undefined) {
          return fallback;
        }

        return String(value);
      }

      function number(value, fallback = 0) {
        const parsed = Number(value);

        return Number.isFinite(parsed)
          ? parsed
          : fallback;
      }

      function firstValue(object, keys, fallback = "") {
        if (!object || typeof object !== "object") {
          return fallback;
        }

        for (const key of keys) {
          if (
            Object.prototype.hasOwnProperty.call(object, key) &&
            object[key] !== null &&
            object[key] !== ""
          ) {
            return object[key];
          }
        }

        return fallback;
      }

      function fixed(value, places = 2) {
        return number(value).toFixed(places);
      }

      function percent(value) {
        const numeric = number(value);

        if (numeric > 1) {
          return numeric.toFixed(1) + "%";
        }

        return (numeric * 100).toFixed(1) + "%";
      }

      function escapeHTML(value) {
        return text(value).replace(
          /[&<>"']/g,
          function (character) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "\"": "&quot;",
              "'": "&#39;"
            }[character];
          }
        );
      }

      function encodePath(path) {
        return path
          .split("/")
          .map(encodeURIComponent)
          .join("/");
      }

      function teamName(franchise) {
        return (
          TEAM_NAME_OVERRIDES[franchise.id] ||
          franchise.name ||
          franchise.abbrev ||
          "Unknown Team"
        );
      }

      function findFranchiseRecords(value, output = []) {
        if (Array.isArray(value)) {
          value.forEach(function (item) {
            findFranchiseRecords(item, output);
          });

          return output;
        }

        if (!value || typeof value !== "object") {
          return output;
        }

        const possibleId =
          value.id ||
          value.franchise_id ||
          value.franchiseId;

        const looksLikeStanding =
          possibleId &&
          (
            value.h2hw !== undefined ||
            value.wins !== undefined ||
            value.win !== undefined ||
            value.pf !== undefined ||
            value.pointsFor !== undefined ||
            value.power_rank !== undefined ||
            value.powerRank !== undefined
          );

        if (looksLikeStanding) {
          output.push(value);
        }

        Object.keys(value).forEach(function (key) {
          findFranchiseRecords(value[key], output);
        });

        return output;
      }

      function uniqueById(records) {
        const map = new Map();

        records.forEach(function (record) {
          const id = text(
            record.id ||
            record.franchise_id ||
            record.franchiseId
          );

          if (id && !map.has(id)) {
            map.set(id, record);
          }
        });

        return Array.from(map.values());
      }

      function normalizeTeam(franchise, standing) {
        const wins = number(
          firstValue(
            standing,
            [
              "h2hw",
              "wins",
              "win",
              "w"
            ],
            0
          )
        );

        const losses = number(
          firstValue(
            standing,
            [
              "h2hl",
              "losses",
              "loss",
              "l"
            ],
            0
          )
        );

        const ties = number(
          firstValue(
            standing,
            [
              "h2ht",
              "ties",
              "tie",
              "t"
            ],
            0
          )
        );

        const games = wins + losses + ties;

        const pctRaw = firstValue(
          standing,
          [
            "pct",
            "winningPercentage",
            "winPct",
            "win_percentage"
          ],
          games
            ? (wins + (ties * 0.5)) / games
            : 0
        );

        const pf = number(
          firstValue(
            standing,
            [
              "pf",
              "pointsFor",
              "points_for",
              "pts"
            ],
            0
          )
        );

        const pa = number(
          firstValue(
            standing,
            [
              "pa",
              "pointsAgainst",
              "points_against"
            ],
            0
          )
        );

        const powerRank = number(
          firstValue(
            standing,
            [
              "power_rank",
              "powerRank",
              "pwr",
              "rank"
            ],
            0
          )
        );

        return {
          id: franchise.id,
          name: teamName(franchise),
          division: text(franchise.division),
          waiverOrder: number(franchise.waiverSortOrder, 0),

          wins: wins,
          losses: losses,
          ties: ties,
          pct: number(pctRaw, 0),

          pf: pf,
          pa: pa,
          diff: pf - pa,

          streak: text(
            firstValue(
              standing,
              [
                "streak",
                "strk",
                "currentStreak"
              ],
              "—"
            )
          ),

          maxPF: number(
            firstValue(
              standing,
              [
                "maxpf",
                "maxPF",
                "max_points",
                "potentialPoints"
              ],
              0
            )
          ),

          minPF: number(
            firstValue(
              standing,
              [
                "minpf",
                "minPF",
                "min_points"
              ],
              0
            )
          ),

          powerRank: powerRank,

          efficiency: number(
            firstValue(
              standing,
              [
                "eff",
                "efficiency",
                "lineupEfficiency",
                "lineup_efficiency"
              ],
              0
            )
          ),

          couldHaveWon: number(
            firstValue(
              standing,
              [
                "couldHaveWon",
                "could_have_won",
                "couldaWon",
                "couldawon",
                "couldWin"
              ],
              0
            )
          ),

          couldHaveLost: number(
            firstValue(
              standing,
              [
                "couldHaveLost",
                "could_have_lost",
                "couldaLost",
                "couldalost",
                "couldLose"
              ],
              0
            )
          ),

          icon: franchise.icon || franchise.logo || ""
        };
      }

      function standingsSort(a, b) {
        if (b.pct !== a.pct) {
          return b.pct - a.pct;
        }

        if (b.wins !== a.wins) {
          return b.wins - a.wins;
        }

        if (b.pf !== a.pf) {
          return b.pf - a.pf;
        }

        return a.name.localeCompare(b.name);
      }

      function powerSort(a, b) {
        if (a.powerRank && b.powerRank) {
          return a.powerRank - b.powerRank;
        }

        if (a.powerRank && !b.powerRank) {
          return -1;
        }

        if (!a.powerRank && b.powerRank) {
          return 1;
        }

        return standingsSort(a, b);
      }

      function differentialClass(value) {
        if (value > 0) {
          return "lsffl-positive";
        }

        if (value < 0) {
          return "lsffl-negative";
        }

        return "lsffl-neutral";
      }

      function pctDisplay(value) {
        const numeric = number(value);

        if (numeric <= 1) {
          return numeric.toFixed(3).replace(/^0/, "");
        }

        return (numeric / 100).toFixed(3).replace(/^0/, "");
      }

      function bannerSource(team) {
        return encodePath(
          "images/banners/" +
          (BANNER_BY_ID[team.id] || "")
        );
      }

      function logoSource(team) {
        return encodePath(
          "images/2ndlogo/" +
          (LOGO_BY_ID[team.id] || "")
        );
      }

      function helmetSource(team) {
        return encodePath(
          "images/helmets/" +
          (HELMET_BY_ID[team.id] || "")
        );
      }

      function teamPage(team) {
        return (
          "https://www48.myfantasyleague.com/2026/options" +
          "?L=51036&O=07&F=" +
          encodeURIComponent(team.id)
        );
      }

      function standingsRow(team, index) {
        const localLogo = logoSource(team);
        const fallbackLogo = escapeHTML(team.icon || "");
        const record = `${team.wins}-${team.losses}-${team.ties}`;

        return `
          <tr
            class="lsffl-clickable-row"
            data-team-url="${teamPage(team)}"
            tabindex="0"
            role="link"
            aria-label="Open ${escapeHTML(team.name)} MFL franchise page"
          >
            <td class="lsffl-rank-cell">${index + 1}</td>

            <td class="lsffl-franchise-cell">
              <a
                class="lsffl-team-link lsffl-standings-franchise"
                href="${teamPage(team)}"
                aria-label="Open ${escapeHTML(team.name)} MFL franchise page"
              >
                <img
                  class="lsffl-standings-logo"
                  src="${localLogo}"
                  alt=""
                  onerror="
                    this.onerror=null;
                    this.src='${fallbackLogo}';
                  "
                >

                <span class="lsffl-standings-copy">
                  <span class="lsffl-standings-name">
                    ${escapeHTML(team.name)}
                  </span>

                  <span class="lsffl-standings-record">
                    ${record}
                  </span>
                </span>
              </a>
            </td>

            <td>${record}</td>
            <td>${pctDisplay(team.pct)}</td>
            <td>${fixed(team.pf)}</td>
            <td>${fixed(team.pa)}</td>

            <td class="${differentialClass(team.diff)}">
              ${team.diff > 0 ? "+" : ""}${fixed(team.diff)}
            </td>

            <td>${escapeHTML(team.streak)}</td>
            <td>${fixed(team.maxPF)}</td>
            <td>${fixed(team.minPF)}</td>
          </tr>
        `;
      }

      function powerRow(team, index) {
        const localLogo = logoSource(team);
        const fallbackLogo = escapeHTML(team.icon || "");

        return `
          <tr
            class="lsffl-clickable-row"
            data-team-url="${teamPage(team)}"
            tabindex="0"
            role="link"
            aria-label="Open ${escapeHTML(team.name)} MFL franchise page"
          >
            <td class="lsffl-power-rank">${index + 1}</td>

            <td>
              <a
                class="lsffl-team-link lsffl-power-franchise"
                href="${teamPage(team)}"
                aria-label="Open ${escapeHTML(team.name)} MFL franchise page"
              >
                <img
                  class="lsffl-power-logo"
                  src="${localLogo}"
                  alt=""
                  onerror="
                    this.onerror=null;
                    this.src='${fallbackLogo}';
                  "
                >

                <span class="lsffl-power-name">
                  ${escapeHTML(team.name)}
                </span>
              </a>
            </td>

            <td>${percent(team.efficiency)}</td>
            <td title="Could Have Won">${team.couldHaveWon || "0"}</td>
            <td title="Could Have Lost">${team.couldHaveLost || "0"}</td>
          </tr>
        `;
      }

      function renderStandings() {
        const divisions =
          Object.entries(divisionsById)
            .sort(function (a, b) {
              return a[0].localeCompare(b[0]);
            });

        if (!divisions.length) {
          divisionStandings.innerHTML = `
            <p class="lsffl-message">
              No division standings are currently available.
            </p>
          `;
          return;
        }

        divisionStandings.innerHTML =
          divisions
            .map(function ([divisionId, divisionName]) {
              const teams =
                allTeams
                  .filter(function (team) {
                    return team.division === divisionId;
                  })
                  .sort(standingsSort);

              const rows = teams.length
                ? teams.map(standingsRow).join("")
                : `
                  <tr>
                    <td colspan="10">
                      <p class="lsffl-message">
                        No teams are assigned to this division.
                      </p>
                    </td>
                  </tr>
                `;

              return `
                <section class="lsffl-division-block">
                  <h2 class="lsffl-division-heading">
                    ${escapeHTML(divisionName)}
                  </h2>

                  <div class="lsffl-division-table-wrap">
                    <table
                      class="lsffl-table lsffl-standings-table"
                      aria-label="${escapeHTML(divisionName)} standings"
                    >
                      <colgroup>
                        <col style="width: 42px">
                        <col style="width: 44%">
                        <col style="width: 68px">
                        <col style="width: 58px">
                        <col style="width: 72px">
                        <col style="width: 72px">
                        <col style="width: 72px">
                        <col style="width: 62px">
                        <col style="width: 78px">
                        <col style="width: 78px">
                      </colgroup>

                      <thead>
                        <tr>
                          <th>#</th>
                          <th>Franchise</th>
                          <th>W-L-T</th>
                          <th>PCT</th>
                          <th>PF</th>
                          <th>PA</th>
                          <th>DIFF</th>
                          <th>STRK</th>
                          <th>MAX PF</th>
                          <th>MIN PF</th>
                        </tr>
                      </thead>

                      <tbody>
                        ${rows}
                      </tbody>
                    </table>
                  </div>
                </section>
              `;
            })
            .join("");
      }

      function renderPowerRankings() {
        const rankedTeams =
          [...allTeams].sort(powerSort);

        powerBody.innerHTML =
          rankedTeams
            .map(powerRow)
            .join("");
      }

      function showError(message) {
        const safeMessage = escapeHTML(message);

        divisionStandings.innerHTML = `
          <p class="lsffl-message lsffl-message-error">
            ${safeMessage}
          </p>
        `;

        powerBody.innerHTML = `
          <tr>
            <td colspan="5">
              <p class="lsffl-message lsffl-message-error">
                ${safeMessage}
              </p>
            </td>
          </tr>
        `;
      }

      async function fetchJSON(url) {
        const response = await fetch(
          url + "?v=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "Unable to load " +
            url +
            " (" +
            response.status +
            ")."
          );
        }

        return response.json();
      }

      async function initialize() {
        try {
          const results = await Promise.all([
            fetchJSON(DATA_FILES.league),
            fetchJSON(DATA_FILES.standings)
          ]);

          const leagueJSON = results[0];
          const standingsJSON = results[1];

          const league = leagueJSON.league || {};

          const franchises = asArray(
            league.franchises &&
            league.franchises.franchise
          );

          const divisions = asArray(
            league.divisions &&
            league.divisions.division
          );

          divisions.forEach(function (division) {
            divisionsById[text(division.id)] =
              division.name ||
              ("Division " + division.id);
          });

          const rawStandingRecords =
            uniqueById(
              findFranchiseRecords(standingsJSON)
            );

          const standingsById = new Map();

          rawStandingRecords.forEach(function (record) {
            const id = text(
              record.id ||
              record.franchise_id ||
              record.franchiseId
            );

            if (id) {
              standingsById.set(id, record);
            }
          });

          allTeams = franchises.map(function (franchise) {
            return normalizeTeam(
              franchise,
              standingsById.get(text(franchise.id)) || {}
            );
          });

          renderStandings();
          renderPowerRankings();
        } catch (error) {
          console.error(error);

          showError(
            "The live LSFFL standings are temporarily unavailable."
          );
        }
      }

      initialize();
    })();
  </script>

  <script id="lsffl-team-popup-system">
    (function () {
      "use strict";

      function openCenteredPopup(url, name, width, height) {
        const dualLeft =
          window.screenLeft !== undefined ? window.screenLeft : window.screenX;

        const dualTop =
          window.screenTop !== undefined ? window.screenTop : window.screenY;

        const viewportWidth =
          window.innerWidth ||
          document.documentElement.clientWidth ||
          screen.width;

        const viewportHeight =
          window.innerHeight ||
          document.documentElement.clientHeight ||
          screen.height;

        const left = Math.max(
          0,
          dualLeft + Math.round((viewportWidth - width) / 2)
        );

        const top = Math.max(
          0,
          dualTop + Math.round((viewportHeight - height) / 2)
        );

        const features = [
          "popup=yes",
          "resizable=yes",
          "scrollbars=yes",
          "status=no",
          "toolbar=no",
          "menubar=no",
          "location=no",
          "width=" + width,
          "height=" + height,
          "left=" + left,
          "top=" + top
        ].join(",");

        const popup = window.open(url, name, features);

        if (popup) {
          popup.focus();
        }

        return popup;
      }


      function openTeamRow(row) {
        const href = row && row.dataset ? row.dataset.teamUrl : "";

        if (!href) {
          return;
        }

        const url = new URL(href, window.location.href);
        const franchiseId =
          url.searchParams.get("F") || "franchise";

        const popup = openCenteredPopup(
          url.href,
          "LSFFL_MFL_Franchise_" +
            franchiseId.replace(/[^a-z0-9]+/gi, "_"),
          1180,
          820
        );

        if (!popup) {
          window.location.href = url.href;
        }
      }

      document.addEventListener(
        "click",
        function (event) {
          if (event.target.closest("a.lsffl-team-link")) {
            return;
          }

          const row = event.target.closest("tr.lsffl-clickable-row");

          if (!row || event.button !== 0) {
            return;
          }

          event.preventDefault();
          openTeamRow(row);
        },
        true
      );

      document.addEventListener(
        "keydown",
        function (event) {
          const row = event.target.closest("tr.lsffl-clickable-row");

          if (!row || (event.key !== "Enter" && event.key !== " ")) {
            return;
          }

          event.preventDefault();
          openTeamRow(row);
        },
        true
      );

      document.addEventListener(
        "click",
        function (event) {
          const link = event.target.closest("a.lsffl-team-link");

          if (!link) {
            return;
          }

          if (
            event.button !== 0 ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey ||
            link.hasAttribute("download")
          ) {
            return;
          }

          event.preventDefault();
          event.stopPropagation();

          const url = new URL(link.href, window.location.href);
          const franchiseId =
            url.searchParams.get("F") || "franchise";

          const popup = openCenteredPopup(
            url.href,
            "LSFFL_MFL_Franchise_" +
              franchiseId.replace(/[^a-z0-9]+/gi, "_"),
            1180,
            820
          );

          if (!popup) {
            window.location.href = url.href;
          }
        },
        true
      );
    })();
  </script>
