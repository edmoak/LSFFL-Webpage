  <script>
    (function () {
      "use strict";

      const DATA_FILES = {

      };
      const DIVISION_BANNER_BY_NAME = {

      };

      const TEAM_NAME_OVERRIDES = {
        "0003": "G-Men",
        "0004": "Hambone Hogs",
        "0006": "Mustangs",
        "0014": "Tiny But Mighty",
        "0015": "Get Off My Ditka"
      };

      const TEAM_PAGE_BY_ID = {
        "0001": "teams/spartans.html",
        "0002": "teams/saints.html",
        "0003": "teams/g-men.html",
        "0004": "teams/hambone-hogs.html",
        "0005": "teams/purple-hooters.html",
        "0006": "teams/mustangs.html",
        "0007": "teams/hawky-bears.html",
        "0008": "teams/da-boys.html",
        "0009": "teams/dawgs.html",
        "0010": "teams/camel-toes.html",
        "0011": "teams/cougars.html",
        "0012": "teams/mothabucca.html",
        "0013": "teams/mad-hatters.html",
        "0014": "teams/tiny-but-mighty.html",
        "0015": "teams/get-off-my-ditka.html",
        "0016": "teams/avalanche.html"
      };

      const divisionStandings =
        document.getElementById("division-standings");
let allTeams = [];
      let divisionsById = {};

      function asArray(value) {
        if (Array.isArray(value)) {
          return value;
        }

        if (value === null || value === undefined) {
          return [];
        }

        return [value];
      }

      function text(value, fallback = "") {
        if (value === null || value === undefined) {
          return fallback;
        }

        return String(value);
      }

      function number(value, fallback = 0) {
        const parsed = Number(value);

        return Number.isFinite(parsed)
          ? parsed
          : fallback;
      }

      function firstValue(object, keys, fallback = "") {
        if (!object || typeof object !== "object") {
          return fallback;
        }

        for (const key of keys) {
          if (
            Object.prototype.hasOwnProperty.call(object, key) &&
            object[key] !== null &&
            object[key] !== ""
          ) {
            return object[key];
          }
        }

        return fallback;
      }

      function fixed(value, places = 2) {
        return number(value).toFixed(places);
      }

        return (numeric * 100).toFixed(1) + "%";
      }

      function escapeHTML(value) {
        return text(value).replace(
          /[&<>"']/g,
          function (character) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "\"": "&quot;",
              "'": "&#39;"
            }[character];
          }
        );
      }

      function encodePath(path) {
        return path
          .split("/")
          .map(encodeURIComponent)
          .join("/");
      }

      function teamName(franchise) {
        return (
          TEAM_NAME_OVERRIDES[franchise.id] ||
          franchise.name ||
          franchise.abbrev ||
          "Unknown Team"
        );
      }

      function findFranchiseRecords(value, output = []) {
        if (Array.isArray(value)) {
          value.forEach(function (item) {
            findFranchiseRecords(item, output);
          });

          return output;
        }

        if (!value || typeof value !== "object") {
          return output;
        }

        const possibleId =
          value.id ||
          value.franchise_id ||
          value.franchiseId;

        const looksLikeStanding =
          possibleId &&
          (
            value.h2hw !== undefined ||
            value.wins !== undefined ||
            value.win !== undefined ||
            value.pf !== undefined ||
            value.pointsFor !== undefined ||
            value.power_rank !== undefined ||
            value.powerRank !== undefined
          );

        if (looksLikeStanding) {
          output.push(value);
        }

        Object.keys(value).forEach(function (key) {
          findFranchiseRecords(value[key], output);
        });

        return output;
      }

      function uniqueById(records) {
        const map = new Map();

        records.forEach(function (record) {
          const id = text(
            record.id ||
            record.franchise_id ||
            record.franchiseId
          );

          if (id && !map.has(id)) {
            map.set(id, record);
          }
        });

        return Array.from(map.values());
      }

      function normalizeTeam(franchise, standing) {
        const wins = number(
          firstValue(
            standing,
            [
              "h2hw",
              "wins",
              "win",
              "w"
            ],
            0
          )
        );

        const losses = number(
          firstValue(
            standing,
            [
              "h2hl",
              "losses",
              "loss",
              "l"
            ],
            0
          )
        );

        const ties = number(
          firstValue(
            standing,
            [
              "h2ht",
              "ties",
              "tie",
              "t"
            ],
            0
          )
        );

        const games = wins + losses + ties;

        const pctRaw = firstValue(
          standing,
          [
            "pct",
            "winningPercentage",
            "winPct",
            "win_percentage"
          ],
          games
            ? (wins + (ties * 0.5)) / games
            : 0
        );

        const pf = number(
          firstValue(
            standing,
            [
              "pf",
              "pointsFor",
              "points_for",
              "pts"
            ],
            0
          )
        );

        const pa = number(
          firstValue(
            standing,
            [
              "pa",
              "pointsAgainst",
              "points_against"
            ],
            0
          )
        );

        const powerRank = number(
          firstValue(
            standing,
            [
              "power_rank",
              "powerRank",
              "pwr",
              "rank"
            ],
            0
          )
        );

        return {
          id: franchise.id,
          name: teamName(franchise),
          division: text(franchise.division),
          waiverOrder: number(franchise.waiverSortOrder, 0),

          wins: wins,
          losses: losses,
          ties: ties,
          pct: number(pctRaw, 0),

          pf: pf,
          pa: pa,
          streak: text(
            firstValue(
              standing,
              [
                "streak",
                "strk",
                "currentStreak"
              ],
              "—"
            )
          ),


          powerRank: powerRank,

          efficiency: number(
            firstValue(
              standing,
              [
                "eff",
                "efficiency",
                "lineupEfficiency",
                "lineup_efficiency"
              ],
              0
            )
          ),

          couldHaveWon: number(
            firstValue(
              standing,
              [
                "couldHaveWon",
                "could_have_won",
                "couldaWon",
                "couldawon",
                "couldWin"
              ],
              0
            )
          ),

          couldHaveLost: number(
            firstValue(
              standing,
              [
                "couldHaveLost",
                "could_have_lost",
                "couldaLost",
                "couldalost",
                "couldLose"
              ],
              0
            )
          ),

          icon: franchise.icon || franchise.logo || ""
        };
      }

      function standingsSort(a, b) {
        if (b.pct !== a.pct) {
          return b.pct - a.pct;
        }

        if (b.wins !== a.wins) {
          return b.wins - a.wins;
        }

        if (b.pf !== a.pf) {
          return b.pf - a.pf;
        }

        return a.name.localeCompare(b.name);
      }

        if (a.powerRank && !b.powerRank) {
          return -1;
        }

        if (!a.powerRank && b.powerRank) {
          return 1;
        }

        return standingsSort(a, b);
      }


      function pctDisplay(value) {
        const numeric = number(value);

        if (numeric <= 1) {
          return numeric.toFixed(3).replace(/^0/, "");
        }

        return (numeric / 100).toFixed(3).replace(/^0/, "");
      }

      function divisionBannerSource(divisionName) {
        const key = text(divisionName).trim().toLowerCase();
        const file = DIVISION_BANNER_BY_NAME[key] || "";

        return file
          ? encodePath("images/banners/" + file)
          : "";
      }

      function logoSource(team) {
        return encodePath(
          "images/2ndlogo/" +
          (LOGO_BY_ID[team.id] || "")
        );
      }

      function teamPage(team) {
        return (
          "https://www48.myfantasyleague.com/2026/options" +
          "?L=51036&F=" +
          encodeURIComponent(team.id) +
          "&O=07"
        );
      }

      function standingsRow(team, index) {
        const localLogo = logoSource(team);
        const fallbackLogo = escapeHTML(team.icon || "");
        const record = `${team.wins}-${team.losses}-${team.ties}`;

        return `
          <tr
            class="lsffl-clickable-row"
            data-team-url="${teamPage(team)}"
            tabindex="0"
            role="link"
            aria-label="Open ${escapeHTML(team.name)} MFL franchise page"
          >
            <td class="lsffl-rank-cell">${index + 1}</td>

            <td class="lsffl-franchise-cell">
              <a
                class="lsffl-team-link lsffl-standings-franchise"
                href="${teamPage(team)}"
                aria-label="Open ${escapeHTML(team.name)} MFL franchise page"
              >
                <img
                  class="lsffl-standings-logo"
                  src="${localLogo}"
                  alt=""
                  onerror="
                    this.onerror=null;
                    this.src='${fallbackLogo}';
                  "
                >

                <span class="lsffl-standings-name">
                  ${escapeHTML(team.name)}
                </span>
              </a>
            </td>

            <td>${record}</td>
            <td>${pctDisplay(team.pct)}</td>
            <td>${fixed(team.pf)}</td>
            <td>${fixed(team.pa)}</td>
            <td>${escapeHTML(team.streak)}</td>
            <td class="lsffl-power-rank-cell">${team.powerRank || "—"}</td>
          </tr>
        `;
      }

      function renderStandings() {
        const divisions =
          Object.entries(divisionsById)
            .sort(function (a, b) {
              return a[0].localeCompare(b[0]);
            });

        if (!divisions.length) {
          divisionStandings.innerHTML = `
            <p class="lsffl-message">
              No division standings are currently available.
            </p>
          `;
          return;
        }

        divisionStandings.innerHTML =
          divisions
            .map(function ([divisionId, divisionName]) {
              const teams =
                allTeams
                  .filter(function (team) {
                    return team.division === divisionId;
                  })
                  .sort(standingsSort);

              const rows = teams.length
                ? teams.map(standingsRow).join("")
                : `
                  <tr>
                    <td colspan="8">
                      <p class="lsffl-message">
                        No teams are assigned to this division.
                      </p>
                    </td>
                  </tr>
                `;

              const divisionBanner =
                divisionBannerSource(divisionName);

              return `
                <section class="lsffl-division-row">
                  <div
                    class="lsffl-division-banner-wrap"
                    aria-hidden="true"
                  >
                    ${
                      divisionBanner
                        ? `
                          <img
                            class="lsffl-division-banner"
                            src="${divisionBanner}"
                            alt=""
                          >
                        `
                        : ""
                    }
                  </div>

                  <section class="lsffl-division-block">
                    <h2 class="lsffl-division-heading">
                      ${escapeHTML(divisionName)}
                    </h2>

                    <div class="lsffl-division-table-wrap">
                      <table
                        class="lsffl-table lsffl-standings-table"
                        aria-label="${escapeHTML(divisionName)} standings"
                      >
                        <colgroup>
                          <col style="width: 42px">
                          <col style="width: 42%">
                          <col style="width: 86px">
                          <col style="width: 68px">
                          <col style="width: 86px">
                          <col style="width: 86px">
                          <col style="width: 68px">
                          <col style="width: 82px">
                        </colgroup>

                        <thead>
                          <tr>
                            <th>#</th>
                            <th>Franchise</th>
                            <th>W-L-T</th>
                            <th>PCT</th>
                            <th>PF</th>
                            <th>PA</th>
                            <th>STRK</th>
                            <th>PWR</th>
                          </tr>
                        </thead>

                        <tbody>
                          ${rows}
                        </tbody>
                      </table>
                    </div>
                  </section>
                </section>
              `;
            })
            .join("");
      }

      function showError(message) {
        const safeMessage = escapeHTML(message);

        divisionStandings.innerHTML = `
          <p class="lsffl-message lsffl-message-error">
            ${safeMessage}
          </p>
        `;
}

      async function fetchJSON(url) {
        const response = await fetch(
          url + "?v=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "Unable to load " +
            url +
            " (" +
            response.status +
            ")."
          );
        }

        return response.json();
      }

      async function initialize() {
        try {
          const results = await Promise.all([
            fetchJSON(DATA_FILES.league),
            fetchJSON(DATA_FILES.standings)
          ]);

          const leagueJSON = results[0];
          const standingsJSON = results[1];

          const league = leagueJSON.league || {};

          const franchises = asArray(
            league.franchises &&
            league.franchises.franchise
          );

          const divisions = asArray(
            league.divisions &&
            league.divisions.division
          );

          divisions.forEach(function (division) {
            divisionsById[text(division.id)] =
              division.name ||
              ("Division " + division.id);
          });

          const rawStandingRecords =
            uniqueById(
              findFranchiseRecords(standingsJSON)
            );

          const standingsById = new Map();

          rawStandingRecords.forEach(function (record) {
            const id = text(
              record.id ||
              record.franchise_id ||
              record.franchiseId
            );

            if (id) {
              standingsById.set(id, record);
            }
          });

          allTeams = franchises.map(function (franchise) {
            return normalizeTeam(
              franchise,
              standingsById.get(text(franchise.id)) || {}
            );
          });

          renderStandings();
        } catch (error) {
          console.error(error);

          showError(
            "The live LSFFL standings are temporarily unavailable."
          );
        }
      }

      initialize();
    })();
  </script>

  <script id="lsffl-team-popup-system">
    (function () {
      "use strict";

      function franchiseIdFromElement(element) {
        const row = element.closest("[data-team-url]");
        const link = element.closest("a.lsffl-team-link");
        const href =
          (link && link.href) ||
          (row && row.dataset.teamUrl) ||
          "";

        if (!href) {
          return "";
        }

        try {
          const url = new URL(href, window.location.href);
          return url.searchParams.get("F") || "";
        } catch (error) {
          return "";
        }
      }

      function requestMFLPopup(franchiseId, fallbackHref) {
        if (!franchiseId) {
          return false;
        }

        /*
         * This standings page is embedded inside the MFL site. The native
         * MFL Scripts popup system lives in the parent page, so the iframe
         * sends the franchise ID upward instead of opening its own window.
         */
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(
            {
              type: "LSFFL_OPEN_FRANCHISE",
              franchiseId: franchiseId
            },
            "*"
          );

          return true;
        }

        /*
         * Same-page fallback, useful when previewing standings directly.
         */
        if (
          window.lsfflOpenFranchisePopup &&
          typeof window.lsfflOpenFranchisePopup === "function"
        ) {
          window.lsfflOpenFranchisePopup(franchiseId);
          return true;
        }

        if (fallbackHref) {
          window.location.href = fallbackHref;
        }

        return false;
      }

      document.addEventListener(
        "click",
        function (event) {
          const link = event.target.closest("a.lsffl-team-link");
          const row = event.target.closest("tr.lsffl-clickable-row");

          if (!link && !row) {
            return;
          }

          if (
            event.button !== 0 ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey
          ) {
            return;
          }

          const target = link || row;
          const franchiseId = franchiseIdFromElement(target);
          const fallbackHref =
            (link && link.href) ||
            (row && row.dataset.teamUrl) ||
            "";

          if (!franchiseId) {
            return;
          }

          event.preventDefault();
          event.stopPropagation();

          requestMFLPopup(franchiseId, fallbackHref);
        },
        true
      );

      document.addEventListener(
        "keydown",
        function (event) {
          if (event.key !== "Enter" && event.key !== " ") {
            return;
          }

          const row = event.target.closest("tr.lsffl-clickable-row");

          if (!row) {
            return;
          }

          const franchiseId = franchiseIdFromElement(row);
          const fallbackHref = row.dataset.teamUrl || "";

          if (!franchiseId) {
            return;
          }

          event.preventDefault();
          requestMFLPopup(franchiseId, fallbackHref);
        },
        true
      );
    })();
  </script>

  <script id="lsffl-franchise-popup-bridge">
(function () {
  "use strict";

  function getFranchiseId(value) {
    try {
      var url = new URL(value, window.location.href);
      var id = String(url.searchParams.get("F") || "").replace(/\D/g, "");

      return id ? id.padStart(4, "0").slice(-4) : "";
    } catch (error) {
      return "";
    }
  }

  document.addEventListener(
    "click",
    function (event) {
      if (
        event.button !== 0 ||
        event.ctrlKey ||
        event.metaKey ||
        event.shiftKey ||
        event.altKey
      ) {
        return;
      }

      var link = event.target.closest("a[href]");
      var row = event.target.closest("[data-team-url]");
      var destination = "";

      if (link) {
        destination = link.href;
      } else if (row) {
        destination = row.getAttribute("data-team-url") || "";
      }

      var franchiseId = getFranchiseId(destination);

      if (!franchiseId) {
        return;
      }

      event.preventDefault();
      event.stopPropagation();

      window.parent.postMessage(
        {
          type: "LSFFL_OPEN_FRANCHISE",
          franchiseId: franchiseId
        },
        "*"
      );
    },
    true
  );
})();
</script>
</body>
</html>
