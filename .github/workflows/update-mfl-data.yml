name: Update MFL Data

"on":
  workflow_dispatch: {}

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-mfl-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create data folder
        run: mkdir -p data

      - name: Download league data
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            "https://www48.myfantasyleague.com/2026/export?TYPE=league&L=51036&JSON=1" \
            --output data/league.json

      - name: Download standings data
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            "https://www48.myfantasyleague.com/2026/export?TYPE=leagueStandings&L=51036&JSON=1" \
            --output data/standings.json

      - name: Verify league data
        run: |
          jq empty data/league.json

          FRANCHISE_COUNT=$(jq '
            .league.franchises.franchise
            | if type == "array" then length else 1 end
          ' data/league.json)

          echo "League franchise count: ${FRANCHISE_COUNT}"

          if [ "${FRANCHISE_COUNT}" -lt 1 ]; then
            echo "No franchises were found in league.json."
            exit 1
          fi

      - name: Verify standings data
        run: |
          jq empty data/standings.json

          if jq -e '.error' data/standings.json > /dev/null 2>&1; then
            echo "MFL returned an error for the standings export:"
            jq '.' data/standings.json
            exit 1
          fi

          STANDINGS_COUNT=$(jq '
            [
              .. |
              objects |
              .franchise? |
              if type == "array" then .[] else . end
            ]
            | map(select(. != null))
            | length
          ' data/standings.json)

          echo "Standings franchise count: ${STANDINGS_COUNT}"

          if [ "${STANDINGS_COUNT}" -lt 1 ]; then
            echo "No franchise standings records were found."
            echo "Downloaded response:"
            jq '.' data/standings.json
            exit 1
          fi

      - name: Create sync information
        run: |
          jq -n \
            --arg season "2026" \
            --arg leagueId "51036" \
            --arg updatedAt "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{
              season: $season,
              leagueId: $leagueId,
              updatedAt: $updatedAt,
              source: "MyFantasyLeague",
              files: [
                "league.json",
                "standings.json"
              ]
            }' \
            > data/sync-status.json

      - name: Commit updated data
        run: |
          git config user.name "LSFFL Data Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/league.json \
            data/standings.json \
            data/sync-status.json

          if git diff --cached --quiet; then
            echo "MFL data has not changed."
            exit 0
          fi

          git commit -m "Update live MFL league and standings data"
          git push
