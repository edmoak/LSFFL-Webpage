<script>
(function () {
  const API_BASE = 'https://lsffl-mfl-proxy.edward-moak.workers.dev/api';

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>'"]/g, function (character) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[character];
    });
  }

  function summarize(data) {
    const source = Array.isArray(data.paragraphs) && data.paragraphs.length
      ? data.paragraphs.join(' ')
      : (data.body || '');
    const clean = String(source).replace(/\s+/g, ' ').trim();
    return clean.length > 115 ? clean.slice(0, 112).trimEnd() + '…' : clean;
  }

  function renderItem(targetId, data) {
    const target = document.getElementById(targetId);
    if (!target) return;

    const title = escapeHTML(data.title || 'Latest Update');
    const date = escapeHTML(data.date || '');
    const summary = escapeHTML(summarize(data));

    target.innerHTML =
      '<li><span class="lsffl-live-title">' + title + '</span>' +
      (date ? '<span class="lsffl-live-date">' + date + '</span>' : '') +
      (summary ? '<span class="lsffl-live-summary">' + summary + '</span>' : '') +
      '</li>';
  }

  function renderError(targetId) {
    const target = document.getElementById(targetId);
    if (target) {
      target.innerHTML =
        '<li class="lsffl-live-error">Latest update is temporarily unavailable.</li>';
    }
  }

  async function load(endpoint, targetId) {
    try {
      const response = await fetch(API_BASE + endpoint, { cache: 'no-store' });

      if (!response.ok) throw new Error(response.status);

      renderItem(targetId, await response.json());
    } catch (e) {
      console.error(e);
      renderError(targetId);
    }
  }

  load('/latest-article', 'lsffl-latest-article');
  load('/latest-message', 'lsffl-latest-message');
})();
</script>

<script src="js/lsffl-ticker.js"></script>

</body>
</html>
